[project]
name = "athena-ml"
version = "0.1.0"
description = "Data collection, training and export for Athena's fast AI-code detector"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "scikit-learn>=1.5", "pyyaml>=6.0", "scipy>=1.13"]

[dependency-groups]
dev = ["pytest>=8.0"]
# Phase 4 (neural student): not needed for the fast detector.
neural = ["torch>=2.5", "transformers>=4.48", "tokenizers>=0.21", "onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.1", "safetensors>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
